  <script>
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const msgEl = document.getElementById("toast-msg");
      msgEl.innerText = msg;
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 3500);
    }

    function downloadAsSVG() {
      const svg = document.getElementById("main-svg");
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svg);

      if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      source = '<?xml version="1.0" standalone="no"?>\r\n' + source;

      const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
      const downloadLink = document.createElement("a");
      downloadLink.href = url;
      downloadLink.download = "coddyhelper_agent_miya_sxemasi.svg";
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      showToast("SVG vektor fayli yuklab olindi!");
    }

    function downloadAsPNG() {
      const btn = document.getElementById("btn-png");
      const oldHtml = btn.innerHTML;
      btn.innerHTML = "<span>⏳</span><span>Tayyorlanmoqda...</span>";
      btn.disabled = true;

      const svg = document.getElementById("main-svg");
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svg);

      const canvas = document.createElement("canvas");
      canvas.width = 3200;
      canvas.height = 2100;
      const ctx = canvas.getContext("2d");

      const img = new Image();
      const svgBlob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
      const DOMURL = window.URL || window.webkitURL || window;
      const url = DOMURL.createObjectURL(svgBlob);

      img.onload = function() {
        ctx.fillStyle = "#090d16";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        DOMURL.revokeObjectURL(url);

        const imgURI = canvas.toDataURL("image/png");
        const downloadLink = document.createElement("a");
        downloadLink.href = imgURI;
        downloadLink.download = "coddyhelper_agent_miya_sxemasi.png";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);

        btn.innerHTML = oldHtml;
        btn.disabled = false;
        showToast("Yuqori sifatli PNG rasm yuklab olindi!");
      };

      img.onerror = function() {
        btn.innerHTML = oldHtml;
        btn.disabled = false;
        alert("PNG yaratishda brauzer cheklovi bo'ldi. SVG formatida yuklab olishingiz mumkin.");
      };

      img.src = url;
    }
  </script>
