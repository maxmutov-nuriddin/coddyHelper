<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoddyHelper - To'liq Miya Sxemasi (Yuklab Olish)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: #070b14 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body class="bg-[#070b14] text-white min-h-screen p-3 sm:p-6 font-sans">
  <div class="max-w-7xl mx-auto space-y-4">
    
    <!-- Top Action Bar -->
    <div class="no-print bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 flex flex-col md:flex-row items-center justify-between gap-4 shadow-2xl backdrop-blur-md">
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-indigo-300 to-pink-400">
          🧠 CoddyHelper — To'liq Kognitiv Miya Sxemasi (5 Core Brains)
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">
          Barcha 6 ta kognitiv bosqich va 5 ta mustaqil miya klasterining to'liq arxitekturasi. Quyidagi tugmalar orqali yuklab olishingiz mumkin.
        </p>
      </div>

      <!-- Download Action Buttons -->
      <div class="flex flex-wrap items-center gap-2.5">
        <!-- PNG Download -->
        <a href="toliq_miya_sxemasi.png" download="coddyhelper_toliq_miya_sxemasi.png" class="flex items-center gap-2 px-4 py-2.5 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white rounded-xl text-xs sm:text-sm font-bold shadow-lg shadow-sky-500/25 transition-all cursor-pointer hover:scale-105 active:scale-95">
          <span>🖼️</span>
          <span>PNG Rasm Yuklab Olish (Yuqori sifat)</span>
        </a>

        <!-- Print / PDF -->
        <button onclick="window.print()" class="flex items-center gap-2 px-3.5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs sm:text-sm font-medium border border-slate-700 transition-all cursor-pointer">
          <span>🖨️</span>
          <span>PDF / Chop Etish</span>
        </button>
      </div>
    </div>

    <!-- Image Display Container -->
    <div class="bg-[#070b14] border border-slate-800 rounded-2xl overflow-hidden shadow-2xl flex justify-center p-2 sm:p-4">
      <img src="toliq_miya_sxemasi.png" alt="CoddyHelper To'liq Miya Sxemasi" class="w-full h-auto max-w-6xl rounded-xl shadow-2xl border border-slate-800" />
    </div>

  </div>
</body>
</html>
